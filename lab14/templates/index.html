<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Item</title>
    <link rel="stylesheet" href="{{url_for('static', filename = 'style.css')}}">
</head>
<body>
    <h1 class="title">Joseph Ali-Shaw</h1>
    <h2>Create Item</h2>
    <form id="itemform">
        <div class="formsession">
            <label>Name:
                <input type="text" id="name" required>
            </label>
        </div>
        <div class="formsession">
            <label>Price:
                <input type="text" id="price" required>
            </label>
        </div>
        <div class="formsession">
            <button type="submit">Submit</button>
        </div>
    </form>
    <p id="response"></p>
    <section>
        <hr>
        <h2>ALL ITEMS</h2>
        <button onclick="loaditems()">LOAD ITEMS</button>
        <ul id="itemslist"> </ul>
    </section>
    <section id="updatesection" style="display: none;">
        <h3>Update item</h3>
        <input type="hidden" id="updateID">
        <label>
        Name: <input type="text" id="updateName">
        </label>
        <label>
        Price: <input type="text" id="updatePrice">
        </label>
        <button onclick="updateItem()">SAVE UPDATE</button>
    </section>
    <script src="{{url_for('static', filename='app_script.js')}}"></script>
</body>
</html>
